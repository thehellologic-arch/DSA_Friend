services:
  - type: web
    name: dsa-friend
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_MODEL
        value: google/gemini-3.6-flash
      - key: OPENROUTER_FALLBACK_MODELS
        value: google/gemini-2.5-flash,deepseek/deepseek-chat
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: reason
      - key: ADMIN_TOKEN
        sync: false
      - key: NOVEL_EVALUATION_MODE
        value: shadow
