problem_id: maximum-subarray-kadane
rubric_version: 1
pattern: kadane
difficulty: 1100
core_ask: "Find the contiguous subarray with the largest sum and return that sum."

optimal:
  approach: "Kadane: scan left to right. Let cur be the best sum ending here (either start fresh at nums[i] or extend). Track the global max of cur."
  complexity: { time: "O(n)", space: "O(1)" }
  key_insight: "A negative prefix can never help a later subarray, so drop it and restart."
  examples:
    - input: "nums = [-2,1,-3,4,-1,2,1,-5,4]"
      output: "6"
      explanation: "The run [4,-1,2,1] has sum 6; Kadane restarts after the early negatives."
    - input: "nums = [1]"
      output: "1"
      explanation: "The only element is the whole array."
    - input: "nums = [-3,-1,-2]"
      output: "-1"
      explanation: "All values are negative, so the answer is the largest single element."

acceptable_alternatives:
  - approach: "Divide and conquer: max of left half, right half, and crossing sum."
    note: "Correct O(n log n); mention Kadane is simpler and faster."

common_wrong_approaches:
  - id: reset_to_zero
    match_signals: ["reset to 0", "max(0, sum)", "ignore negatives"]
    why_wrong: "If every number is negative, resetting to 0 reports 0 instead of the largest element."
    counterexample: "nums = [-3,-1,-2] — answer is -1, not 0"
  - id: nested_sums
    match_signals: ["all subarrays", "nested loops", "prefix of prefixes"]
    why_wrong: "O(n²) or O(n³) will TLE."
    counterexample: "n = 10^5"

required_insights:
  - id: best_ending_here
    desc: "At each index, chooses extend vs start a new subarray"
    weight: 3
    hints:
      - "Should the subarray ending at i include the previous run?"
      - "cur = max(nums[i], cur + nums[i])."
    on_fail_suggestion: "Don't enumerate all ranges. Keep the best sum ending at i, restarting when the prefix is worse than starting over."
  - id: global_max
    desc: "Tracks the maximum of those ending-here sums"
    weight: 2
    hints:
      - "The answer is not only the final cur. Why?"
      - "best = max(best, cur) at every step."
  - id: all_negative
    desc: "Handles an all-negative array by never forcing the sum to 0"
    weight: 1
    hints:
      - "Is an empty subarray allowed?"
      - "Initialize from nums[0] (or use max(nums[i], cur+nums[i])), not from 0."
  - id: complexity
    desc: "States O(n) time and O(1) space"
    weight: 1
    hints:
      - "How many passes?"
      - "One pass, two scalars: O(n) / O(1)."

edge_cases: ["single element", "all negative", "all positive", "zeros mixed in"]

scoring:
  formula: "sum(weight of insights hit) / sum(all weights)"
  hint_penalty_per_reveal: 0.1
  self_correction_bonus: 0.05
