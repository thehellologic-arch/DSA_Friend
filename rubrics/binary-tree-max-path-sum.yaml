problem_id: binary-tree-max-path-sum
rubric_version: 1
pattern: tree
difficulty: 1800
core_ask: "A path is any node sequence with parent-child edges (need not pass through the root). Return the maximum path sum of any path."

optimal:
  approach: "DFS returning the best downward gain from this node (node.val + max(0, leftGain, rightGain)). While visiting, candidate path is node.val + max(0,left) + max(0,right). Track a global max. Negative children are dropped."
  complexity: { time: "O(n)", space: "O(h)" }
  key_insight: "A path can 'bend' at a node using both children, but a parent can only take one downward arm, so the recursive return value is a single-arm gain."
  examples:
    - input: "root = [1,2,3]"
      output: "6"
      explanation: "2-1-3."
    - input: "root = [-10,9,20,null,null,15,7]"
      output: "42"
      explanation: "15-20-7; -10 is not helpful."
    - input: "root = [-3]"
      output: "-3"
      explanation: "The path is the single negative node; you cannot pick empty."

acceptable_alternatives:
  - approach: "Same DFS with a boxed/global variable or returning a pair (down, best)."
    note: "Equivalent."

common_wrong_approaches:
  - id: root_to_leaf_only
    match_signals: ["only root to leaf", "must include root"]
    why_wrong: "The best path may sit entirely in a subtree."
    counterexample: "[-10,9,20,null,null,15,7] answer 42 not through root"
  - id: include_negatives
    match_signals: ["always add both children", "never skip negative"]
    why_wrong: "A negative child decreases the path; you may omit it (but must keep at least the node when the whole tree is negative)."
    counterexample: "[2,-1] best is 2, not 1"

required_insights:
  - id: bend_vs_down
    desc: "Separates the two-child 'bend' candidate from the one-child gain returned to the parent"
    weight: 3
    hints:
      - "Can a parent use both of your subtrees?"
      - "Both children can join a path that peaks at this node, but the value you return upward can include only one arm."
      - "Compute a bend (left + node + right) for the global max; return only node + the best single child (or node alone)."
    on_fail_suggestion: "At each node, compute a bend (left+node+right) for the global max, but return only node + best single child (or node alone)."
  - id: drop_negative
    desc: "Treats negative child gains as 0 when extending"
    weight: 2
    hints:
      - "Should you extend into a subtree with negative gain?"
      - "No — max(0, childGain)."
  - id: all_negative
    desc: "Allows a single-node path so the answer can be the largest (least negative) value"
    weight: 1
    hints:
      - "Is the empty path allowed?"
      - "No; initialize global with root.val or -inf and always consider node.val."
  - id: complexity
    desc: "States O(n)"
    weight: 1
    hints:
      - "Postorder once?"
      - "O(n)."

edge_cases: ["single negative", "all negative", "skewed", "positives on both sides"]

scoring:
  formula: "sum(weight of insights hit) / sum(all weights)"
  hint_penalty_per_reveal: 0.1
  self_correction_bonus: 0.05
