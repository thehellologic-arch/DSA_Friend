problem_id: set-matrix-zeroes
rubric_version: 1
pattern: matrix
difficulty: 1400
core_ask: "If an element is 0, set its entire row and column to 0. Do it in place."

optimal:
  approach: "Use the first row and first column as markers, plus a boolean for whether the first column (or row) originally had a zero. Scan, mark, then zero from the marks, handling the first row/col last."
  complexity: { time: "O(m n)", space: "O(1)" }
  key_insight: "The matrix itself can store which rows/cols to clear; you just have to not clobber the first row/col metadata too early."
  examples:
    - input: "[[1,1,1],[1,0,1],[1,1,1]]"
      output: "[[1,0,1],[0,0,0],[1,0,1]]"
      explanation: "The 0 at (1,1) marks row 1 and col 1."
    - input: "[[0,1,2,0],[3,4,5,2],[1,3,1,5]]"
      output: "[[0,0,0,0],[0,4,5,0],[0,3,1,0]]"
      explanation: "First row and last column also zero from the two original 0s."
    - input: "[[1,0]]"
      output: "[[0,0]]"
      explanation: "Single row; the zero clears the whole row."

acceptable_alternatives:
  - approach: "Boolean arrays of size m and n for row/col flags."
    note: "Correct O(m+n) extra space; the marker trick is O(1)."

common_wrong_approaches:
  - id: zero_while_scanning
    match_signals: ["zero the row immediately when you see a 0"]
    why_wrong: "You create new zeros that then zero extra rows/cols."
    counterexample: "[[1,0],[1,1]] — immediate row zero then treats col 0 as a new zero source incorrectly depending on order"
  - id: extra_copy
    match_signals: ["copy the whole matrix"]
    why_wrong: "O(mn) extra space; problem wants in-place."
    counterexample: "Follow-up: constant extra space"

required_insights:
  - id: mark_then_clear
    desc: "Records which rows/cols need zeroing before writing zeros"
    weight: 2
    hints:
      - "Why can't you zero a row as soon as you see a 0?"
      - "New zeros would cascade. Mark first, write second."
  - id: first_row_col_markers
    desc: "Uses first row/col (plus one flag) as O(1) storage"
    weight: 3
    hints:
      - "Where can you store an m-length and n-length bitset for free?"
      - "matrix[i][0] and matrix[0][j], with a separate first-col flag."
    on_fail_suggestion: "Don't mutate as you go. Mark rows/cols (ideally in row0/col0), then zero, first row/col last."
  - id: complexity
    desc: "States O(mn) time and O(1) extra space for the marker method"
    weight: 1
    hints:
      - "Two passes over the grid?"
      - "O(mn) / O(1)."

edge_cases: ["zero in first row", "zero in first column", "all nonzero", "entire row zeros already"]

scoring:
  formula: "sum(weight of insights hit) / sum(all weights)"
  hint_penalty_per_reveal: 0.1
  self_correction_bonus: 0.05
