problem_id: buy-sell-stock-one-pass
rubric_version: 1
pattern: greedy
difficulty: 900
core_ask: "Given daily prices, choose one buy day and a later sell day to maximize profit. Return 0 if no profit is possible."

optimal:
  approach: "Scan left to right, track the lowest price seen so far, and at each day compute profit if you sold today. Keep the maximum profit."
  complexity: { time: "O(n)", space: "O(1)" }
  key_insight: "The best buy for a sell day is the minimum price before that day, so one pass is enough."
  examples:
    - input: "prices = [7,1,5,3,6,4]"
      output: "5"
      explanation: "Buy at 1 and sell at 6; while scanning, min stays 1 and profit peaks at 5."
    - input: "prices = [7,6,4,3,1]"
      output: "0"
      explanation: "Prices only fall, so the running max profit never leaves 0."
    - input: "prices = [2,4,1,7]"
      output: "6"
      explanation: "After min resets to 1, selling at 7 yields 6, which beats the earlier 2."

acceptable_alternatives:
  - approach: "Compare every buy/sell pair."
    note: "Correct but O(n²); accept only if they also see the one-pass improvement."

common_wrong_approaches:
  - id: buy_first_sell_max
    match_signals: ["buy on day 1", "buy the first", "sell at global max"]
    why_wrong: "The global max may occur before a later cheaper buy."
    counterexample: "prices = [2,4,1,7] — buying first yields 2, not 6"
  - id: allow_sell_before_buy
    match_signals: ["max minus min", "global max - global min"]
    why_wrong: "You cannot sell before you buy."
    counterexample: "prices = [7,1] — max-min is 6 but the only valid trade loses money"

required_insights:
  - id: track_min_so_far
    desc: "Tracks the lowest buy price seen so far"
    weight: 3
    hints:
      - "For today's sell, which earlier price would you want to have bought at?"
      - "Keep a running minimum as you scan."
    on_fail_suggestion: "You don't need every pair. Track the cheapest price so far and try selling today."
  - id: max_profit_update
    desc: "Updates max profit using price minus min-so-far"
    weight: 2
    hints:
      - "Once you know the best buy so far, what do you compare against the answer?"
      - "profit = today - minSoFar; keep the max."
  - id: no_profit_zero
    desc: "Returns 0 when prices never rise"
    weight: 1
    hints:
      - "What if every later day is cheaper?"
      - "Initialize max profit to 0 so a losing market yields 0."
  - id: complexity
    desc: "States O(n) time and O(1) space"
    weight: 1
    hints:
      - "How many times do you look at each price?"
      - "One pass, a few scalars: O(n) time, O(1) space."

edge_cases: ["single day", "strictly decreasing", "strictly increasing", "duplicate prices"]

scoring:
  formula: "sum(weight of insights hit) / sum(all weights)"
  hint_penalty_per_reveal: 0.1
  self_correction_bonus: 0.05
