problem_id: encode-decode-strings
rubric_version: 1
pattern: string
difficulty: 1400
core_ask: "Design encode and decode for a list of strings so that decode(encode(strs)) always returns the original list. Strings may contain any characters including delimiters. (Premium)"

optimal:
  approach: "Length-prefix: encode as ''.join(f'{len(s)}#{s}' for s in strs). Decode by reading an integer until '#', then take that many chars, repeat."
  complexity: { time: "O(N)", space: "O(N)" }
  key_insight: "A raw delimiter inside the payload is safe if you never search for it as a separator — the length tells you exactly how many characters belong to this string."
  examples:
    - input: "strs = ['hello','world']"
      output: "encode → '5#hello5#world' → decode back to the same list"
      explanation: "Lengths 5 and 5 frame each payload."
    - input: "strs = ['','#','a#b']"
      output: "'0#1##3#a#b'"
      explanation: "Empty string is 0#; '#' is 1##; 'a#b' is 3#a#b."
    - input: "strs = []"
      output: "empty encode; decode yields []"
      explanation: "No chunks."

acceptable_alternatives:
  - approach: "Escape the delimiter (e.g. replace # with ## and use #| as sep)."
    note: "Correct but easier to get wrong; length-prefix is robust."

common_wrong_approaches:
  - id: join_comma
    match_signals: ["join with comma", "split on space", "JSON without thought"]
    why_wrong: "The separator can appear inside a string (or empty strings collapse)."
    counterexample: "['a,b','c'] joined by comma is not uniquely decodable"
  - id: split_on_hash_only
    match_signals: ["split('#') without lengths"]
    why_wrong: "Payloads can contain #."
    counterexample: "['#',''] "

required_insights:
  - id: length_prefix
    desc: "Stores an unambiguous size before each string (or an equivalent escaping scheme)"
    weight: 3
    hints:
      - "How do you know where one string ends if it contains the delimiter?"
      - "Write len(s), then a marker, then exactly that many chars."
    on_fail_suggestion: "Don't join with a character that can appear in the data. Use length#payload chunks."
  - id: decode_scan
    desc: "Parses by reading the integer, skipping the marker, then slicing n characters"
    weight: 2
    hints:
      - "How does decode walk the blob?"
      - "Find '#', int(prefix), slice i:i+n, repeat."
  - id: empties
    desc: "Handles empty strings and empty list"
    weight: 1
    hints:
      - "How is '' encoded?"
      - "0# with no payload chars."
  - id: complexity
    desc: "States O(total characters)"
    weight: 1
    hints:
      - "One pass each way?"
      - "O(N)."

edge_cases: ["empty list", "empty string in list", "delimiter in payload", "non-ascii"]

scoring:
  formula: "sum(weight of insights hit) / sum(all weights)"
  hint_penalty_per_reveal: 0.1
  self_correction_bonus: 0.05
