services:
  - type: web
    name: dsa-friend
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
